openapi: 3.1.0
info:
  title: TAMV Online Network Ecosystem Discovery API
  version: 1.0.0
  description: >-
    Public discovery catalog for TAMV ecosystem repositories. Catalog visibility
    does not establish service health, identity federation, authorization, or trust.
servers:
  - url: /
paths:
  /api/v1/ecosystem:
    get:
      operationId: getPublicEcosystemCatalog
      summary: Retrieve the public ecosystem catalog
      description: Returns catalog metadata only; it does not probe remote systems.
      tags: [Ecosystem]
      responses:
        "200":
          description: Ecosystem catalog returned successfully.
          headers:
            Cache-Control:
              schema:
                type: string
            X-Content-Type-Options:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EcosystemCatalog"
        "500":
          description: Unexpected server error.
  /api/v1/ecosystem/metadata:
    get:
      operationId: getPublicEcosystemRepositoryMetadata
      tags: [Ecosystem]
      summary: Retrieve bounded public GitHub repository metadata for the ecosystem catalog
      description: >-
        Reads metadata only from the fixed GitHub REST API origin for repository URLs already present in the static registry.
        Per-repository failures are returned in the response. This does not assert deployed application health,
        authentication, authorization, data synchronization, source correctness, or trust.
      responses:
        "200":
          description: Per-repository public metadata results; individual upstream failures do not fail the overall response.
          headers:
            Cache-Control:
              schema: { type: string }
            X-Content-Type-Options:
              schema: { type: string }
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EcosystemRepositoryMetadataResponse"
        "500":
          description: Unexpected failure while constructing the response.
  /api/v1/provenance/validate:
    post:
      operationId: validateProvenanceRecord
      summary: Validate a provenance record against the v1 schema
      description: Stateless schema validation only. Does not fetch source URLs, persist records, verify authorship, or establish signature, trusted timestamp, peer review, or accreditation.
      tags: [Provenance]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProvenanceRecord"
      responses:
        "200":
          description: Record satisfies the schema. This is not source verification.
          content:
            application/json:
              schema:
                type: object
                required: [valid, schemaVersion, submittedValidationState, semantics]
                properties:
                  valid: { type: boolean, const: true }
                  schemaVersion: { type: string, const: "1.0.0" }
                  submittedValidationState: { type: string, enum: [unreviewed, schema_valid, source_verified, rejected], description: Claimed input state; not independently verified by this endpoint. }
                  semantics: { type: string }
        "400":
          description: Malformed JSON or invalid UTF-8.
        "413":
          description: Payload exceeds 65536 bytes.
        "415":
          description: Content-Type must be application/json.
        "422":
          description: JSON is valid but fails the provenance schema.
          content:
            application/json:
              schema:
                type: object
                required: [valid, error, issues]
                properties:
                  valid: { type: boolean, const: false }
                  error: { type: string, const: schema_validation_failed }
                  issues:
                    type: array
                    items:
                      type: object
                      required: [path, code, message]
                      properties:
                        path: { type: string }
                        code: { type: string }
                        message: { type: string }
components:
  schemas:
    EcosystemRepositoryMetadataResponse:
      type: object
      additionalProperties: false
      required: [schemaVersion, checkedAt, scope, systems]
      properties:
        schemaVersion: { type: string, const: "1.0.0" }
        checkedAt: { type: string, format: date-time }
        scope: { type: string }
        systems:
          type: array
          items:
            $ref: "#/components/schemas/EcosystemRepositoryMetadataEntry"
    EcosystemRepositoryMetadataEntry:
      type: object
      additionalProperties: false
      required: [systemId, name, repository, sourceMetadataStatus, checkedAt, metadata]
      properties:
        systemId: { type: string, pattern: "^[a-z0-9-]+$" }
        name: { type: string, minLength: 1 }
        repository: { type: string, format: uri }
        sourceMetadataStatus:
          type: string
          enum: [metadata_available, not_found, rate_limited, timeout, upstream_error, invalid_response]
        checkedAt: { type: string, format: date-time }
        metadata:
          type: [object, "null"]
          additionalProperties: false
          required: [repositoryId, fullName, url, defaultBranch, archived, updatedAt, pushedAt, primaryLanguage, licenseSpdxId]
          properties:
            repositoryId: { type: integer, minimum: 1 }
            fullName: { type: string }
            url: { type: string, format: uri }
            defaultBranch: { type: string, minLength: 1 }
            archived: { type: boolean }
            updatedAt: { type: string, format: date-time }
            pushedAt: { type: [string, "null"], format: date-time }
            primaryLanguage: { type: [string, "null"] }
            licenseSpdxId: { type: [string, "null"] }
    ProvenanceRecord:
      type: object
      additionalProperties: false
      required: [schemaVersion, sourceUri, sourceSystem, observedAt, validationState]
      properties:
        schemaVersion: { type: string, const: "1.0.0" }
        sourceUri: { type: string, format: uri, minLength: 1, description: "Runtime accepts HTTP or HTTPS only." }
        sourceSystem: { type: string, minLength: 1, maxLength: 200 }
        sourceRecordId: { type: [string, "null"], maxLength: 500 }
        sourceVersion: { type: [string, "null"], maxLength: 300 }
        observedAt: { type: string, format: date-time, description: "Must include an explicit timezone and valid calendar date." }
        license: { type: [string, "null"], maxLength: 200 }
        contentDigest:
          oneOf:
            - type: "null"
            - type: object
              additionalProperties: false
              required: [algorithm, value]
              properties:
                algorithm: { type: string, enum: [sha-256, sha-384, sha-512] }
                value: { type: string, pattern: "^[a-fA-F0-9]+$" }
              description: "Hex digest length must match the selected algorithm."
        validationState:
          type: string
          enum: [unreviewed, schema_valid, source_verified, rejected]
        validationEvidenceUri: { type: [string, "null"], format: uri, description: "Runtime accepts HTTP or HTTPS only." }
        notes: { type: [string, "null"], maxLength: 2000 }
    EcosystemCatalog:
      type: object
      additionalProperties: false
      required: [schemaVersion, system, generatedAt, statusSemantics, securityBoundary, systems]
      properties:
        schemaVersion:
          type: string
          const: 1.0.0
        system:
          type: string
          const: TAMV Online Network
        generatedAt:
          type: string
          format: date-time
        statusSemantics:
          type: object
          required: [catalogued, contracted, adapter_implemented, contract_tested, verified]
          properties:
            catalogued: { type: string }
            contracted: { type: string }
            adapter_implemented: { type: string }
            contract_tested: { type: string }
            verified: { type: string }
        securityBoundary:
          type: string
        systems:
          type: array
          items:
            $ref: "#/components/schemas/EcosystemSystem"
    EcosystemSystem:
      type: object
      additionalProperties: false
      required:
        - id
        - name
        - repository
        - responsibility
        - integrationState
        - integrationMode
        - canonicalData
        - allowedInitialCapabilities
        - prohibitedAssumptions
      properties:
        id: { type: string, pattern: "^[a-z0-9-]+$" }
        name: { type: string, minLength: 1 }
        repository: { type: string, format: uri }
        responsibility: { type: string, minLength: 1 }
        integrationState:
          type: string
          enum: [catalogued, contracted, adapter_implemented, contract_tested, verified]
        integrationMode:
          type: string
          enum: [public_metadata, static_site, application, pipeline, trust_service, curriculum]
        canonicalData:
          type: array
          items: { type: string }
        allowedInitialCapabilities:
          type: array
          items: { type: string }
        prohibitedAssumptions:
          type: array
          items: { type: string }
