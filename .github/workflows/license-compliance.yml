name: License, SBOM and release evidence

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "README.md"
      - "package.json"
      - "pnpm-lock.yaml"
      - "LICENSE"
      - "LICENSE-DOCS"
      - "LICENSES/**"
      - "NOTICE"
      - "tests/**"
      - "app/**"
      - "lib/**"
      - "scripts/**"
      - "migrations/**"
      - "docs/legal/**"
      - ".github/workflows/license-compliance.yml"
  push:
    branches: [main]
    paths:
      - "README.md"
      - "package.json"
      - "pnpm-lock.yaml"
      - "LICENSE"
      - "LICENSE-DOCS"
      - "LICENSES/**"
      - "NOTICE"
      - "tests/**"
      - "app/**"
      - "lib/**"
      - "scripts/**"
      - "migrations/**"
      - "docs/legal/**"
      - ".github/workflows/license-compliance.yml"

permissions:
  contents: read

concurrency:
  group: license-evidence-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sbom:
    name: Generate dependency SBOM and preserve audit evidence
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: "12.16.1"
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Generate SPDX JSON SBOM
        uses: anchore/sbom-action@v0
        with:
          path: .
          format: spdx-json
          output-file: tamv-sbom.spdx.json
          upload-artifact: false
          artifact-name: tamv-sbom-spdx
      - name: Generate CycloneDX JSON SBOM
        uses: anchore/sbom-action@v0
        with:
          path: .
          format: cyclonedx-json
          output-file: tamv-sbom.cdx.json
          upload-artifact: false
          artifact-name: tamv-sbom-cyclonedx
      - name: Upload SBOMs and lockfile as audit evidence
        uses: actions/upload-artifact@v4
        with:
          name: tamv-license-audit-${{ github.sha }}
          if-no-files-found: error
          retention-days: 90
          path: |
            tamv-sbom.spdx.json
            tamv-sbom.cdx.json
            pnpm-lock.yaml
            LICENSE
            LICENSE-DOCS
            LICENSES/**
            NOTICE
            docs/legal/asset-register.csv
            docs/legal/LICENSING-VALIDATION-TRACKER.md
      - name: Record evidence metadata
        run: |
          {
            echo "## TAMV license evidence"
            echo
            echo "- Commit: ${{ github.sha }}"
            echo "- Ref: ${{ github.ref }}"
            echo "- SBOM formats: SPDX JSON, CycloneDX JSON"
            echo "- Dependency install: frozen lockfile"
            echo "- Limitation: SBOM generation is inventory evidence, not a legal compatibility verdict."
          } >> "$GITHUB_STEP_SUMMARY"

  dependency-audit:
    name: Audit production dependency advisories
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: "12.16.1"
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Audit production dependencies
        run: pnpm audit --prod --audit-level high
      - name: Record audit scope
        if: always()
        run: |
          {
            echo "## Dependency audit"
            echo
            echo "- Commit: ${{ github.sha }}"
            echo "- Command: pnpm audit --prod --audit-level high"
            echo "- Scope: production dependency advisories; this does not assess license compatibility."
          } >> "$GITHUB_STEP_SUMMARY"

  repository-validation:
    name: Test, typecheck and build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: "12.16.1"
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Run tests
        run: pnpm test
      - name: TypeScript check
        run: pnpm typecheck
      - name: Production build
        run: pnpm build
      - name: Record validation metadata
        if: always()
        run: |
          {
            echo "## Repository validation"
            echo
            echo "- Commit: ${{ github.sha }}"
            echo "- Node: $(node --version)"
            echo "- pnpm: $(pnpm --version)"
            echo "- Commands: pnpm test; pnpm typecheck; pnpm build"
            echo "- Build success does not prove production secrets, database migrations, authentication integrations or deployment health."
          } >> "$GITHUB_STEP_SUMMARY"
