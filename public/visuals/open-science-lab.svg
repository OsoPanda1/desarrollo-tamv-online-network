<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc"><title id="title">Open science research workflow</title><desc id="desc">A reproducible research workflow linking question, method, dataset, peer review and reusable output.</desc><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#081522"/><stop offset="1" stop-color="#163149"/></linearGradient><pattern id="g" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#83d9d2" stroke-opacity=".08"/></pattern></defs><rect width="1200" height="675" fill="url(#bg)"/><rect width="1200" height="675" fill="url(#g)"/><text x="52" y="54" fill="#8de9df" font-family="Arial" font-size="14" letter-spacing="4">TAMV / REPRODUCIBLE RESEARCH</text><g font-family="Arial" text-anchor="middle"><ellipse cx="600" cy="340" rx="390" ry="200" fill="none" stroke="#6fd7cf" stroke-opacity=".25" stroke-width="2"/><ellipse cx="600" cy="340" rx="285" ry="145" fill="none" stroke="#edc68a" stroke-opacity=".25" stroke-width="2"/><g fill="#102f42" stroke-width="2"><rect x="470" y="100" width="260" height="82" rx="12" stroke="#86baff"/><rect x="800" y="265" width="260" height="82" rx="12" stroke="#70d5cd"/><rect x="470" y="490" width="260" height="82" rx="12" stroke="#edc68a"/><rect x="140" y="265" width="260" height="82" rx="12" stroke="#b5a0f0"/></g><g fill="#f1f7fa" font-size="18" font-weight="700"><text x="600" y="134">RESEARCH QUESTION</text><text x="600" y="157" font-size="13" font-weight="400" fill="#b4d1df">Scope · hypotheses · ethics</text><text x="930" y="299">METHOD + DATA</text><text x="930" y="322" font-size="13" font-weight="400" fill="#b4d1df">Versioned · licensed</text><text x="600" y="524">REVIEW + REUSE</text><text x="600" y="547" font-size="13" font-weight="400" fill="#b4d1df">DOI · artifacts · replication</text><text x="270" y="299">EVIDENCE</text><text x="270" y="322" font-size="13" font-weight="400" fill="#b4d1df">Sources · limitations</text></g><g fill="none" stroke="#8de9df" stroke-width="3"><path d="M730 145L830 265m-14-5 14 5 1-15"/><path d="M930 347L730 490m14-1-14 1 4-14"/><path d="M470 530L400 347m-2 14 2-14 12 9"/><path d="M270 265L470 145m-14 1 14-1-4 14"/></g><circle cx="600" cy="340" r="64" fill="#0e3d4a" stroke="#8de9df" stroke-width="2"/><path d="M570 342l20 20 42-48" fill="none" stroke="#f3d7a9" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/><text x="600" y="430" fill="#d7e9ef" font-size="14">TRANSPARENCY BY DESIGN</text></g><text x="1155" y="635" fill="#9db7c4" font-family="monospace" font-size="13" text-anchor="end">CONCEPTUAL MODEL · NO EMPIRICAL RESULTS IMPLIED</text></svg>