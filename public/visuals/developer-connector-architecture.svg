<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc"><title id="title">Public SDK and connector architecture</title><desc id="desc">A bounded connector architecture linking typed contracts, policy checks, provider adapters, observability and provenance.</desc><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#071522"/><stop offset="1" stop-color="#142b40"/></linearGradient><pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#8bd9d1" stroke-opacity=".08"/></pattern></defs><rect width="1200" height="675" fill="url(#bg)"/><rect width="1200" height="675" fill="url(#grid)"/><text x="52" y="54" fill="#8de9df" font-family="Arial" font-size="14" letter-spacing="4">TAMV / DEVELOPER PLATFORM</text><g font-family="Arial" text-anchor="middle"><rect x="360" y="100" width="480" height="76" rx="12" fill="#12374a" stroke="#8de9df" stroke-width="2"/><text x="600" y="132" fill="#f0fafc" font-size="20" font-weight="700">PUBLIC CONNECTOR SDK</text><text x="600" y="155" fill="#b3d4df" font-size="13">Typed contract · input validation · timeouts</text><g fill="#102f42" stroke-width="2"><rect x="70" y="280" width="220" height="105" rx="12" stroke="#86baff"/><rect x="350" y="280" width="220" height="105" rx="12" stroke="#70d5cd"/><rect x="630" y="280" width="220" height="105" rx="12" stroke="#edc68a"/><rect x="910" y="280" width="220" height="105" rx="12" stroke="#b5a0f0"/></g><g fill="#edf7fa" font-size="17" font-weight="700"><text x="180" y="322">POLICY GATE</text><text x="460" y="322">ADAPTER</text><text x="740" y="322">PROVIDER API</text><text x="1020" y="322">PROVENANCE</text></g><g fill="#a9c6d4" font-size="13"><text x="180" y="347">Scopes · allowlist</text><text x="460" y="347">Normalized errors</text><text x="740" y="347">Public / synthetic data</text><text x="1020" y="347">Trace ID · event</text></g><g fill="none" stroke="#8de9df" stroke-width="3"><path d="M460 176L180 280m15-2-15 2 3-15"/><path d="M500 176L460 280m-3-14 3 14 10-10"/><path d="M700 176L740 280m-10-10 10 10 3-14"/><path d="M740 176L1020 280m-15-2 15 2-3-15"/></g><path d="M180 385v70h840v-70" fill="none" stroke="#e7b98a" stroke-width="2" stroke-dasharray="7 8"/><text x="600" y="500" fill="#f0d3b1" font-size="18" font-weight="700">STAGING → TESTS → REVIEW → AUTHORIZED RELEASE</text></g><text x="1150" y="635" fill="#9db7c4" font-family="monospace" font-size="13" text-anchor="end">CONCEPTUAL MODEL · NOT A LIVE SYSTEM</text></svg>