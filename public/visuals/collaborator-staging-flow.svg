<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc"><title id="title">Controlled external collaboration and staging</title><desc id="desc">A staged contribution lifecycle with identity, scoped access, pull request review, security checks and authorized migration.</desc><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#071522"/><stop offset="1" stop-color="#142b40"/></linearGradient><pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#8bd9d1" stroke-opacity=".08"/></pattern></defs><rect width="1200" height="675" fill="url(#bg)"/><rect width="1200" height="675" fill="url(#grid)"/><text x="52" y="54" fill="#8de9df" font-family="Arial" font-size="14" letter-spacing="4">TAMV / CONTRIBUTOR GOVERNANCE</text><g font-family="Arial" text-anchor="middle"><g fill="#102f42" stroke-width="2"><rect x="55" y="225" width="180" height="120" rx="14" stroke="#86baff"/><rect x="280" y="225" width="180" height="120" rx="14" stroke="#70d5cd"/><rect x="505" y="225" width="180" height="120" rx="14" stroke="#edc68a"/><rect x="730" y="225" width="180" height="120" rx="14" stroke="#b5a0ef"/><rect x="955" y="225" width="190" height="120" rx="14" stroke="#9bd8aa"/></g><g fill="#edf7fa" font-size="17" font-weight="700"><text x="145" y="266">IDENTITY</text><text x="370" y="266">STAGING</text><text x="595" y="266">PULL REQUEST</text><text x="820" y="266">SECURITY REVIEW</text><text x="1050" y="266">MIGRATION</text></g><g fill="#a9c6d4" font-size="13"><text x="145" y="293">Scoped role · expiry</text><text x="370" y="293">Fork · synthetic data</text><text x="595" y="293">Tests · provenance</text><text x="820" y="293">Least privilege</text><text x="1050" y="293">Human authorization</text></g><g fill="none" stroke="#8de9df" stroke-width="3"><path d="M235 285h45m-12-10 12 10-12 10"/><path d="M460 285h45m-12-10 12 10-12 10"/><path d="M685 285h45m-12-10 12 10-12 10"/><path d="M910 285h45m-12-10 12 10-12 10"/></g><path d="M1050 345v85H145v-85" fill="none" stroke="#e6b98a" stroke-width="2" stroke-dasharray="7 8"/><text x="600" y="470" fill="#f0d3b1" font-size="19" font-weight="700">NO DIRECT WRITE TO THE CANONICAL CORE</text><text x="600" y="503" fill="#a9c6d4" font-size="15">Contract · review evidence · rollback plan · access revocation</text></g><text x="1150" y="635" fill="#9db7c4" font-family="monospace" font-size="13" text-anchor="end">CONCEPTUAL MODEL · NOT A LIVE SYSTEM</text></svg>