<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc"><title id="title">Human oversight for AI systems</title><desc id="desc">A human decision loop around an AI system with review, override, incident reporting and rollback controls.</desc><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#071522"/><stop offset="1" stop-color="#172a40"/></linearGradient><pattern id="g" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#83d9d2" stroke-opacity=".08"/></pattern></defs><rect width="1200" height="675" fill="url(#bg)"/><rect width="1200" height="675" fill="url(#g)"/><text x="52" y="54" fill="#8de9df" font-family="Arial" font-size="14" letter-spacing="4">LATAMV / HUMAN AUTHORITY</text><circle cx="600" cy="337" r="200" fill="none" stroke="#71d8cf" stroke-width="2" stroke-dasharray="7 10" stroke-opacity=".65"/><circle cx="600" cy="337" r="135" fill="#0e3142" stroke="#86baff" stroke-width="2"/><g fill="#eaf5fa" font-family="Arial" text-anchor="middle"><text x="600" y="316" font-size="25" font-weight="700">AI SYSTEM</text><text x="600" y="347" font-size="15" fill="#b7d2df">Suggestions · bounded actions</text><text x="600" y="374" font-size="13" fill="#f0c9a0">NO SELF-GRANTED AUTHORITY</text></g><g fill="#102f42" stroke-width="2"><rect x="75" y="265" width="230" height="125" rx="15" stroke="#edc68a"/><rect x="895" y="265" width="230" height="125" rx="15" stroke="#9bd8aa"/><rect x="420" y="100" width="360" height="92" rx="15" stroke="#b5a0f0"/><rect x="420" y="485" width="360" height="92" rx="15" stroke="#e68eac"/></g><g fill="#f1f7fa" font-family="Arial" text-anchor="middle"><text x="190" y="308" font-size="19" font-weight="700">HUMAN REVIEW</text><text x="190" y="335" font-size="13" fill="#b4d1df">Context · impact · approval</text><text x="1010" y="308" font-size="19" font-weight="700">OVERRIDE / STOP</text><text x="1010" y="335" font-size="13" fill="#b4d1df">Revoke · rollback · appeal</text><text x="600" y="138" font-size="19" font-weight="700">POLICY + EVIDENCE</text><text x="600" y="163" font-size="13" fill="#b4d1df">Explicit criteria before action</text><text x="600" y="523" font-size="19" font-weight="700">INCIDENT + REPAIR</text><text x="600" y="548" font-size="13" fill="#b4d1df">Owner · deadline · evidence</text></g><g fill="none" stroke="#8de9df" stroke-width="3"><path d="M420 146L330 265m15-6-15 6-1-15"/><path d="M780 146L870 265m-15-6 15 6 1-15"/><path d="M330 390L450 485m-15-3 15 3-3-15"/><path d="M870 390L750 485m15-3-15 3 3-15"/></g><text x="1155" y="635" fill="#9db7c4" font-family="monospace" font-size="13" text-anchor="end">CONCEPTUAL MODEL · HUMAN AUTHORITY RETAINED</text></svg>