<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc"><title id="title">Knowledge provenance lifecycle</title><desc id="desc">A review lifecycle for source origin, verification, uncertainty, impact assessment, publication and retrieval.</desc><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#081522"/><stop offset="1" stop-color="#112b3c"/></linearGradient><pattern id="g" width="34" height="34" patternUnits="userSpaceOnUse"><path d="M34 0H0V34" fill="none" stroke="#83d9d2" stroke-opacity=".08"/></pattern></defs><rect width="1200" height="675" fill="url(#bg)"/><rect width="1200" height="675" fill="url(#g)"/><text x="52" y="54" fill="#8de9df" font-family="Arial" font-size="14" letter-spacing="4">TINA / KNOWLEDGE QUALITY</text><g font-family="Arial" text-anchor="middle"><g fill="#102e40" stroke-width="2"><rect x="80" y="145" width="260" height="95" rx="12" stroke="#7bb9d5"/><rect x="470" y="145" width="260" height="95" rx="12" stroke="#70d5cd"/><rect x="860" y="145" width="260" height="95" rx="12" stroke="#b5a2ef"/><rect x="860" y="365" width="260" height="95" rx="12" stroke="#edc68a"/><rect x="470" y="365" width="260" height="95" rx="12" stroke="#e6a2b9"/><rect x="80" y="365" width="260" height="95" rx="12" stroke="#9bd8aa"/></g><g fill="#f1f7fa" font-size="18" font-weight="700"><text x="210" y="183">01 · ORIGIN</text><text x="600" y="183">02 · VERIFICATION</text><text x="990" y="183">03 · UNCERTAINTY</text><text x="990" y="403">04 · IMPACT REVIEW</text><text x="600" y="403">05 · HUMAN APPROVAL</text><text x="210" y="403">06 · PUBLICATION</text></g><g fill="#a8c5d2" font-size="13"><text x="210" y="209">Source · author · license</text><text x="600" y="209">Independent corroboration</text><text x="990" y="209">Assumptions · confidence</text><text x="990" y="429">Risk · affected groups</text><text x="600" y="429">Authority · repair owner</text><text x="210" y="429">Version · receipt · review</text></g><g fill="