<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc"><title id="title">Cryptographic provenance chain</title><desc id="desc">An artifact moves through canonicalization, SHA-512 digest, Ed25519 signature, timestamp and audit receipt.</desc><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#071522"/><stop offset="1" stop-color="#17263d"/></linearGradient><pattern id="g" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#8bd9d1" stroke-opacity=".08"/></pattern></defs><rect width="1200" height="675" fill="url(#bg)"/><rect width="1200" height="675" fill="url(#g)"/><text x="52" y="54" fill="#8de9df" font-family="Arial" font-size="14" letter-spacing="4">BOOKPI / PROVENANCE AND INTEGRITY</text><g font-family="Arial" text-anchor="middle"><g fill="#102e40" stroke-width="2"><rect x="58" y="245" width="175" height="130" rx="14" stroke="#7baac0"/><rect x="280" y="245" width="175" height="130" rx="14" stroke="#72d5cc"/><rect x="502" y="245" width="175" height="130" rx="14" stroke="#92b8ff"/><rect x="724" y="245" width="175" height="130" rx="14" stroke="#edc68a"/><rect x="946" y="245" width="196" height="130" rx="14" stroke="#b6a1ef"/></g><g fill="#f1f7fa" font-size="18" font-weight="700"><text x="145" y="290">ARTIFACT</text><text x="367" y="290">SHA-512</text><text x="589" y="290">ED25519</text><text x="811" y="290">UTC TIME</text><text x="1044" y="290">AUDIT RECEIPT</text></g><g fill="#a8c5d2" font-size="13"><text x="145" y="319">Canonical bytes</text><text x="145" y="341">+ version</text><text x="367" y="319">Digest</text><text x="367" y="341">integrity check</text><text x="589" y="319">Signer key ID</text><text x="589" y="341">signature verify</text><text x="811" y="319">Timestamp</text><text x="811" y="341">context</text><text x="1044" y="319">Append-only event</text><text x="1044" y="341">+ evidence links</text></g><g fill="none" stroke="#8de9df" stroke-width="3"><path d="M233 310h47m-12-10 12 10-12 10"/><path d="M455 310h47m-12-10 12 10-12 10"/><path d="M677 310h47m-12-10 12 10-12 10"/><path d="M899 310h47m-12-10 12 10-12 10"/></g><path d="M145 420v52h899v-52" fill="none" stroke="#d9b98c" stroke-width="2" stroke-dasharray="7 8"/><text x="595" y="510" fill="#e9d2b3" font-size="17">VERIFY THE CHAIN · DO NOT TRUST A HASH ALONE</text><text x="595" y="540" fill="#9db7c4" font-size="14">Key custody · canonicalization · revocation · timestamp trust · independent review</text></g><text x="1155" y="635" fill="#9db7c4" font-family="monospace" font-size="13" text-anchor="end">CONCEPTUAL MODEL · NOT A SIGNED RECEIPT</text></svg>