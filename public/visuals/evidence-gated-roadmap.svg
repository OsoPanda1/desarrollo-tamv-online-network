<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc"><title id="title">Evidence-gated product roadmap</title><desc id="desc">A roadmap that separates proposed, implemented, tested, deployed and externally verified states.</desc><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#071522"/><stop offset="1" stop-color="#142b40"/></linearGradient><pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#8bd9d1" stroke-opacity=".08"/></pattern></defs><rect width="1200" height="675" fill="url(#bg)"/><rect width="1200" height="675" fill="url(#grid)"/><text x="52" y="54" fill="#8de9df" font-family="Arial" font-size="14" letter-spacing="4">TAMV / DELIVERY GOVERNANCE</text><g font-family="Arial" text-anchor="middle"><path d="M145 330H1055" stroke="#6fd7cf" stroke-width="4" stroke-opacity=".65"/><g><circle cx="170" cy="330" r="18" fill="#102f42" stroke="#86baff" stroke-width="3"/><circle cx="385" cy="330" r="18" fill="#102f42" stroke="#70d5cd" stroke-width="3"/><circle cx="600" cy="330" r="18" fill="#102f42" stroke="#edc68a" stroke-width="3"/><circle cx="815" cy="330" r="18" fill="#102f42" stroke="#b5a0f0" stroke-width="3"/><circle cx="1030" cy="330" r="18" fill="#102f42" stroke="#9bd8aa" stroke-width="3"/></g><g fill="#102f42" stroke-width="2"><rect x="70" y="170" width="200" height="92" rx="12" stroke="#86baff"/><rect x="285" y="410" width="200" height="92" rx="12" stroke="#70d5cd"/><rect x="500" y="170" width="200" height="92" rx="12" stroke="#edc68a"/><rect x="715" y="410" width="200" height="92" rx="12" stroke="#b5a0f0"/><rect x="930" y="170" width="200" height="92" rx="12" stroke="#9bd8aa"/></g><g fill="#edf7fa" font-size="18" font-weight="700"><text x="170" y="207">PROPOSED</text><text x="385" y="447">IMPLEMENTED</text><text x="600" y="207">TESTED</text><text x="815" y="447">DEPLOYED</text><text x="1030" y="207">VERIFIED</text></g><g fill="#a9c6d4" font-size="13"><text x="170" y="232">Scope · acceptance</text><text x="385" y="472">Code · review</text><text x="600" y="232">Repeatable evidence</text><text x="815" y="472">Environment · SHA</text><text x="1030" y="232">Independent source</text></g><g fill="none" stroke="#8de9df" stroke-width="2.5"><path d="M170 262v50M385 348v62M600 262v50M815 348v62M1030 262v50"/></g><text x="600" y="565" fill="#f0d3b1" font-size="18" font-weight="700">NO STATUS ADVANCES WITHOUT ITS REQUIRED EVIDENCE</text></g><text x="1150" y="635" fill="#9db7c4" font-family="monospace" font-size="13" text-anchor="end">CONCEPTUAL MODEL · NOT A LIVE SYSTEM</text></svg>