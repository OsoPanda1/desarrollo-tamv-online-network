<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc"><title id="title">AI governance framework</title><desc id="desc">A layered model for identity, authority, policy, evidence and safety with human oversight.</desc><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#081522"/><stop offset="1" stop-color="#182d44"/></linearGradient><pattern id="g" width="36" height="36" patternUnits="userSpaceOnUse"><path d="M36 0H0V36" fill="none" stroke="#c2d4e2" stroke-opacity=".07"/></pattern></defs><rect width="1200" height="675" fill="url(#bg)"/><rect width="1200" height="675" fill="url(#g)"/><text x="54" y="55" fill="#8de9df" font-family="Arial" font-size="14" letter-spacing="4">LATAMV / GOVERNANCE SYSTEM</text><g transform="translate(130 130)"><rect width="940" height="420" rx="20" fill="#0b1c2a" stroke="#456175" stroke-width="2"/><text x="470" y="48" fill="#edf7fa" text-anchor="middle" font-family="Arial" font-size="24" font-weight="700">DETERMINISTIC AUTHORIZATION GATE</text><g font-family="Arial" text-anchor="middle" font-size="17" font-weight="700"><rect x="44" y="90" width="150" height="90" rx="12" fill="#123b4b" stroke="#70d5cd" stroke-width="2"/><text x="119" y="130" fill="#f2fbfc">IDENTITY</text><text x="119" y="153" fill="#a6d7d8" font-size="12">WHO?</text><rect x="220" y="90" width="150" height="90" rx="12" fill="#21324d" stroke="#91b9ff" stroke-width="2"/><text x="295" y="130" fill="#f2fbfc">AUTHORITY</text><text x="295" y="153" fill="#b8cff8" font-size="12">MAY ACT?</text><rect x="396" y="90" width="150" height="90" rx="12" fill="#3c2e28" stroke="#edc18b" stroke-width="2"/><text x="471" y="130" fill="#f2fbfc">POLICY</text><text x="471" y="153" fill="#e7c8a6" font-size="12">ALLOWED?</text><rect x="572" y="90" width="150" height="90" rx="12" fill="#302847" stroke="#b8a2f0" stroke-width="2"/><text x="647" y="130" fill="#f2fbfc">EVIDENCE</text><text x="647" y="153" fill="#d2c7f6" font-size="12">PROVEN?</text><rect x="748" y="90" width="150" height="90" rx="12" fill="#173b32" stroke="#9bd8aa" stroke-width="2"/><text x="823" y="130" fill="#f2fbfc">SAFETY</text><text x="823" y="153" fill="#b7e7c0" font-size="12">SAFE?</text></g><g stroke="#80d9d2" stroke-width="2" fill="none"><path d="M119 180V220H823V180"/><path d="M295 180V220M471 180V220M647 180V220"/><path d="M470 220V255"/></g><rect x="330" y="255" width="280" height="65" rx="12" fill="#123d4b" stroke="#7ce0d7" stroke-width="2"/><text x="470" y="283" text-anchor="middle" fill="#eafafa" font-family="monospace" font-size="19" font-weight="700">ALLOW = TRUE</text><text x="470" y="303" text-anchor="middle" fill="#a9d8d9" font-family="Arial" font-size="12">ALL CONDITIONS MUST PASS</text><path d="M470 320V345" stroke="#ed9d9d" stroke-width="2"/><rect x="330" y="345" width="280" height="48" rx="9" fill="#3d2028" stroke="#df8d99" stroke-width="2"/><text x="470" y="375" text-anchor="middle" fill="#ffe7e9" font-family="Arial" font-size="16" font-weight="700">HUMAN OVERSIGHT + AUDIT</text></g><text x="1155" y="635" fill="#9db7c4" font-family="monospace" font-size="13" text-anchor="end">CONCEPTUAL MODEL · NOT A CERTIFICATION</text></svg>