<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc"><title id="title">Zero trust security architecture</title><desc id="desc">Threat boundaries between client, server runtime, secrets vault and external providers.</desc><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#071421"/><stop offset="1" stop-color="#102c40"/></linearGradient><pattern id="g" width="28" height="28" patternUnits="userSpaceOnUse"><path d="M28 0H0V28" fill="none" stroke="#83d9d2" stroke-opacity=".07"/></pattern></defs><rect width="1200" height="675" fill="url(#bg)"/><rect width="1200" height="675" fill="url(#g)"/><text x="52" y="54" fill="#8de9df" font-family="Arial" font-size="14" letter-spacing="4">TAMV / SECURITY ENGINEERING</text><g font-family="Arial"><rect x="60" y="170" width="235" height="310" rx="16" fill="#102a3d" stroke="#7baac0" stroke-width="2"/><text x="177" y="210" text-anchor="middle" fill="#eaf5f9" font-size="20" font-weight="700">PUBLIC CLIENT</text><rect x="95" y="242" width="165" height="52" rx="8" fill="#18394b" stroke="#7baac0"/><text x="177" y="274" text-anchor="middle" fill="#d8ebf1" font-size="15">Browser UI</text><rect x="95" y="315" width="165" height="52" rx="8" fill="#18394b" stroke="#7baac0"/><text x="177" y="347" text-anchor="middle" fill="#d8ebf1" font-size="15">Public config only</text><text x="177" y="422" text-anchor="middle" fill="#f0b5bb" font-size="14">NO PRIVATE KEYS</text><rect x="355" y="145" width="275" height="360" rx="16" fill="#102f3a" stroke="#6bd4ca" stroke-width="2"/><text x="492" y="188" text-anchor="middle" fill="#eaf5f9" font-size="20" font-weight="700">SERVER RUNTIME</text><rect x="395" y="220" width="195" height="54" rx="8" fill="#17464c" stroke="#6bd4ca"/><text x="492" y="253" text-anchor="middle" fill="#e1fbf7" font-size="15">Auth + policy gate</text><rect x="395" y="300" width="195" height="54" rx="8" fill="#17464c" stroke="#6bd4ca"/><text x="492" y="333" text-anchor="middle" fi