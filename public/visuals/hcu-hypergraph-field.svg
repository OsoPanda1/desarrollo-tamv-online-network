<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc"><title id="title">HCU hypergraph field</title><desc id="desc">A conceptual multi-domain network with nodes and edges, intended as a visual introduction to the interactive HCU explorer.</desc><defs><radialGradient id="bg"><stop stop-color="#153c50"/><stop offset="1" stop-color="#06121f"/></radialGradient><pattern id="g" width="28" height="28" patternUnits="userSpaceOnUse"><path d="M28 0H0V28" fill="none" stroke="#83d9d2" stroke-opacity=".08"/></pattern><filter id="glow"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs><rect width="1200" height="675" fill="url(#bg)"/><rect width="1200" height="675" fill="url(#g)"/><text x="52" y="54" fill="#8de9df" font-family="Arial" font-size="14" letter-spacing="4">HCU / HYPERGRAPH OBSERVATORY</text><g fill="none" stroke-width="2"><path d="M600 330L310 190L250 370L430 500L600 330L870 170L990 350L810 500L600 330L600 115M310 190L600 115L870 170M250 370L600 540L810 500M990 350L600 540" stroke="#71d8cf" stroke-opacity=".58"/><path d="M310 190L990 350M250 370L870 170M430 500L600 115M810 500L310 190" stroke="#e7b87e" stroke-opacity=".35" stroke-dasharray="6 8"/></g><g filter="url(#glow)"><circle cx="600" cy="330" r="44" fill="#103f51" stroke="#a0eee6" stroke-width="3"/><circle cx="310" cy="190" r="25" fill="#1b4058" stroke="#86baff" stroke-width="3"/><circle cx="250" cy="370" r="20" fill="#403344" stroke="#e68eac" stroke-width="3"/><circle cx="430" cy="500" r="24" fill="#264b3e" stroke="#9bd8aa" stroke-width="3"/><circle cx="870" cy="170" r="27" fill="#443a2b" stroke="#edca79" stroke-width="3"/><circle cx="990" cy="350" r="23" fill="#253c5b" stroke="#86baff" stroke-width="3"/><circle cx="810" cy="500" r="24" fill="#423247" stroke="#b5a0f0" stroke-width="3"/><circle cx="600" cy="115" r="19" fill="#214a50" stroke="#6fe0d3" stroke-width="3"/><circle cx="600" cy="540" r="18" fill="#214a50" stroke="#6fe0d3" stroke-width="3"/></g><g fill="#eaf6fa" font-family="Arial" font-size="16"><text x="600" y="395" text-anchor="middle" font-weight="700">DOMAIN CORE</text><text x="310" y="150" text-anchor="middle">GOVERNANCE</text><text x="250" y="410" text-anchor="middle">RISK</text><text x="430" y="545" text-anchor="middle">EVIDENCE</text><text x="870" y="130" text-anchor="middle">RESEARCH</text><text x="990" y="390" text-anchor="middle">SECURITY</text><text x="810" y="545" text-anchor="middle">HUMAN</text><text x="600" y="85" text-anchor="middle">POLICY</text><text x="600" y="580" text-anchor="middle">PROVENANCE</text></g><text x="1155" y="635" fill="#9db7c4" font-family="monospace" font-size="13" text-anchor="end">ILLUSTRATIVE ONLY · OPEN THE INTERACTIVE HCU</text></svg>