<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc"><title id="title">Progressive learning pathway</title><desc id="desc">A learning pathway that moves from orientation to practice, evidence and review without claiming certification.</desc><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#071522"/><stop offset="1" stop-color="#142b40"/></linearGradient><pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#8bd9d1" stroke-opacity=".08"/></pattern></defs><rect width="1200" height="675" fill="url(#bg)"/><rect width="1200" height="675" fill="url(#grid)"/><text x="52" y="54" fill="#8de9df" font-family="Arial" font-size="14" letter-spacing="4">TAMV / DIGITAL LEARNING</text><g font-family="Arial" text-anchor="middle"><circle cx="600" cy="330" r="175" fill="none" stroke="#6fd7cf" stroke-opacity=".22" stroke-width="2"/><circle cx="600" cy="330" r="115" fill="none" stroke="#e9c394" stroke-opacity=".35" stroke-width="2"/><g fill="#102f42" stroke-width="2"><rect x="435" y="95" width="330" height="80" rx="13" stroke="#86baff"/><rect x="795" y="290" width="300" height="80" rx="13" stroke="#70d5cd"/><rect x="435" y="485" width="330" height="80" rx="13" stroke="#edc68a"/><rect x="105" y="290" width="300" height="80" rx="13" stroke="#b5a0ef"/></g><g fill="#edf7fa" font-size="19" font-weight="700"><text x="600" y="128">01 · ORIENT</text><text x="945" y="323">02 · PRACTICE</text><text x="600" y="518">03 · PRODUCE EVIDENCE</text><text x="255" y="323">04 · REVIEW</text></g><g fill="#a9c6d4" font-size="13"><text x="600" y="151">Concepts · navigation · safety</text><text x="945" y="346">Guided tasks · sandbox</text><text x="600" y="541">Artifact · source · version</text><text x="255" y="346">Feedback · repair · reflection</text></g><g fill="none" stroke="#8de9df" stroke-width="3"><path d="M765 135L850 290m-13-6 13 6 1-15"/><path d="M945 370L765 485m15-1-15 1 5-14"/><path d="M435 525L350 370m14 6-14-6-1 15"/><path d="M255 290L435 135m-15 1 15-1-5 14"/></g></g><text x="1150" y="635" fill="#9db7c4" font-family="monospace" font-size="13" text-anchor="end">CONCEPTUAL MODEL · NOT A LIVE SYSTEM</text></svg>