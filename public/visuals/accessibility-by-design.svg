<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc"><title id="title">Accessible interface and reduced-motion design</title><desc id="desc">An interface quality model connecting semantic structure, keyboard operation, contrast, alternatives and motion preferences.</desc><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#071522"/><stop offset="1" stop-color="#142b40"/></linearGradient><pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#8bd9d1" stroke-opacity=".08"/></pattern></defs><rect width="1200" height="675" fill="url(#bg)"/><rect width="1200" height="675" fill="url(#grid)"/><text x="52" y="54" fill="#8de9df" font-family="Arial" font-size="14" letter-spacing="4">TAMV / ACCESSIBLE EXPERIENCE</text><g font-family="Arial" text-anchor="middle"><circle cx="600" cy="330" r="110" fill="#10384a" stroke="#8de9df" stroke-width="3"/><text x="600" y="321" fill="#f2fbfc" font-size="23" font-weight="700">ACCESS</text><text x="600" y="352" fill="#b8d7df" font-size="15">BY DESIGN</text><g fill="#102f42" stroke-width="2"><rect x="95" y="130" width="250" height="100" rx="12" stroke="#86baff"/><rect x="855" y="130" width="250" height="100" rx="12" stroke="#70d5cd"/><rect x="95" y="435" width="250" height="100" rx="12" stroke="#edc68a"/><rect x="855" y="435" width="250" height="100" rx="12" stroke="#b5a0f0"/></g><g fill="#edf7fa" font-size="18" font-weight="700"><text x="220" y="169">SEMANTIC HTML</text><text x="980" y="169">KEYBOARD</text><text x="220" y="474">CONTRAST + TYPE</text><text x="980" y="474">MOTION + ALT TEXT</text></g><g fill="#a9c6d4" font-size="13"><text x="220" y="194">Landmarks · headings</text><text x="980" y="194">Focus · visible states</text><text x="220" y="499">Readable · scalable</text><text x="980" y="499">Reduced motion · meaning</text></g><g fill="none" stroke="#8de9df" stroke-width="2.5"><path d="M345 180L495 280M855 180L705 280M34