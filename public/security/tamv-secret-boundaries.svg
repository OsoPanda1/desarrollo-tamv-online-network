<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 900" role="img" aria-labelledby="title desc">
  <title id="title">TAMV — límites de confianza y secretos</title>
  <desc id="desc">Diagrama de arquitectura que separa el navegador público, las rutas del servidor, el gestor de secretos y los servicios externos. Los secretos no deben pasar al cliente, al repositorio ni a los registros.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#091521"/><stop offset="1" stop-color="#162f43"/></linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#c08a5d"/><stop offset="1" stop-color="#e7c5a1"/></linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="6" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#b6c8d5"/></marker>
    <marker id="goldArrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#d5a77f"/></marker>
    <style>
      text{font-family:Arial,Helvetica,sans-serif}
      .eyebrow{font-size:13px;letter-spacing:3px;font-weight:700;fill:#d5a77f}
      .heading{font-size:34px;font-weight:700;fill:#f7f4ed}
      .sub{font-size:16px;fill:#bdcbd4}
      .boxTitle{font-size:19px;font-weight:700;fill:#f7f4ed}
      .body{font-size:14px;fill:#c3d0d9}
      .small{font-size:12px;fill:#a9bac6}
      .tag{font-size:12px;font-weight:700;letter-spacing:1px}
      .panel{fill:#11283a;stroke:#3e596d;stroke-width:1.5}
      .safe{fill:#112e2c;stroke:#4b9789;stroke-width:1.5}
      .warn{fill:#35251f;stroke:#b77a54;stroke-width:1.5}
      .line{fill:none;stroke:#b6c8d5;stroke-width:2;marker-end:url(#arrow)}
      .goldLine{fill:none;stroke:#d5a77f;stroke-width:2;marker-end:url(#goldArrow)}
      .divider{stroke:#365063;stroke-width:1}
    </style>
  </defs>
  <rect width="1440" height="900" rx="24" fill="url(#bg)"/>
  <g opacity=".13" stroke="#8ba4b5" stroke-width="1"><path d="M0 90H1440M0 180H1440M0 270H1440M0 360H1440M0 450H1440M0 540H1440M0 630H1440M0 720H1440M0 810H1440"/><path d="M90 0V900M180 0V900M270 0V900M360 0V900M450 0V900M540 0V900M630 0V900M720 0V900M810 0V900M900 0V900M990 0V900M1080 0V900M1170 0V900M1260 0V900M1350 0V900"/></g>
  <circle cx="1260" cy="110" r="180" fill="none" stroke="#b77a54" stroke-opacity=".16" stroke-width="2"/><circle cx="1260" cy="110" r="135" fill="none" stroke="#b77a54" stroke-opacity=".12" stroke-width="2"/>
  <text x="78" y="82" class="eyebrow">TAMV ONLINE NETWORK · SECURITY ARCHITECTURE</text>
  <text x="78" y="132" class="heading">Límites de confianza y secretos</text>
  <text x="78" y="165" class="sub">Principio operativo: una credencial de servidor nunca es un dato de interfaz.</text>
  <rect x="78" y="220" width="270" height="230" rx="18" class="panel"/>
  <text x="106" y="260" class="eyebrow">01 · PÚBLICO</text>
  <text x="106" y="296" class="boxTitle">Navegador / UI</text>
  <text x="106" y="331" class="body"><tspan x="106" dy="0">HTML, CSS, imágenes</tspan><tspan x="106" dy="24">y datos públicos mínimos</tspan></text>
  <line x1="106" y1="386" x2="320" y2="386" class="divider"/>
  <text x="106" y="415" class="tag" fill="#6ac2ac">PERMITIDO</text>
  <text x="106" y="435" class="small">Sin tokens ni credenciales</text>
  <rect x="422" y="220" width="300" height="230" rx="18" class="safe"/>
  <text x="450" y="260" class="eyebrow">02 · SERVIDOR</text>
  <text x="450" y="296" class="boxTitle">Route Handlers</text>
  <text x="450" y="331" class="body"><tspan x="450" dy="0">Autenticación y autorización</tspan><tspan x="450" dy="24">Validación · límites · auditoría</tspan></text>
  <line x1="450" y1="386" x2="694" y2="386" class="divider"/>
  <text x="450" y="415" class="tag" fill="#6ac2ac">CONTROL</text>
  <text x="450" y="435" class="small">Mínimo privilegio y fail-closed</text>
  <rect x="796" y="220" width="270" height="230" rx="18" class="warn"/>
  <text x="824" y="260" class="eyebrow">03 · PRIVADO</text>
  <text x="824" y="296" class="boxTitle">Gestor de secretos</text>
  <text x="824" y="331" class="body"><tspan x="824" dy="0">DATABASE_URL</tspan><tspan x="824" dy="24">BETTER_AUTH_SECRET</tspan><tspan x="824" dy="24">TAMV_ADMIN_BOOTSTRAP_TOKEN</tspan></text>
  <line x1="824" y1="405" x2="1038" y2="405" class="divider"/>
  <text x="824" y="431" class="small">Valores nunca versionados</text>
  <rect x="1140" y="220" width="222" height="230" rx="18" class="panel"/>
  <text x="1167" y="260" class="eyebrow">04 · SERVICIOS</text>
  <text x="1167" y="296" class="boxTitle">Dependencias</text>
  <text x="1167" y="331" class="body"><tspan x="1167" dy="0">PostgreSQL</tspan><tspan x="1167" dy="24">Better Auth</tspan><tspan x="1167" dy="24">APIs autorizadas</tspan></text>
  <line x1="1167" y1="405" x2="1335" y2="405" class="divider"/>
  <text x="1167" y="431" class="small">Rotación y logs revisados</text>
  <path d="M348 328H410" class="line"/><path d="M722 328H784" class="goldLine"/><path d="M1066 328H1128" class="goldLine"/>
  <text x="379" y="310" class="small" text-anchor="middle">HTTPS</text>
  <text x="753" y="310" class="small" text-anchor="middle">lectura autorizada</text>
  <text x="1097" y="310" class="small" text-anchor="middle">TLS</text>
  <rect x="78" y="510" width="620" height="220" rx="18" class="panel"/>
  <text x="108" y="552" class="eyebrow">NO DEBE CONTENER SECRETOS</text>
  <text x="108" y="590" class="boxTitle">Repositorio, bundles y registros</text>
  <text x="108" y="626" class="body"><tspan x="108" dy="0">• Código fuente y commits</tspan><tspan x="108" dy="25">• Variables NEXT_PUBLIC_*</tspan><tspan x="108" dy="25">• Logs, capturas y artefactos descargables</tspan></text>
  <rect x="724" y="510" width="638" height="220" rx="18" class="safe"/>
  <text x="754" y="552" class="eyebrow">RESPUESTA A INCIDENTES</text>
  <text x="754" y="590" class="boxTitle">Detectar → Rotar → Revocar → Verificar</text>
  <text x="754" y="626" class="body"><tspan x="754" dy="0">1. Identificar la credencial y su alcance</tspan><tspan x="754" dy="25">2. Rotar en el proveedor propietario y actualizar consumidores</tspan><tspan x="754" dy="25">3. Revisar actividad y volver a probar rutas críticas</tspan></text>
  <line x1="78" y1="778" x2="1362" y2="778" stroke="#3e596d"/>
  <text x="78" y="815" class="small">ESQUEMA DE CONTROL · No certifica la configuración real del proyecto</text>
  <text x="1362" y="815" class="small" text-anchor="end">TAMV · 2026-11-28</text>
  <text x="78" y="850" class="small">Las variables nombradas son referencias documentadas; no se muestran valores de credenciales.</text>
</svg>
