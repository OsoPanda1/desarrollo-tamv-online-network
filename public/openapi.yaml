openapi: 3.1.0
info:
  title: TAMV Online Network — Public Research API
  version: 1.0.0
  description: >-
    Contract for the public, read-only API routes implemented in the TAMV
    Online Network repository. Responses depend on the configured application
    database and may return HTTP 503. This specification documents source
    contracts; it does not certify live deployment availability, third-party
    validation, causal validity, or a license for linked materials.
  termsOfService: https://tamv.online/gobernanza
  contact:
    name: TAMV Online Network
    url: https://tamv.online/desarrolladores
servers:
  - url: /
    description: Same-origin API; use the origin where this application is deployed.
tags:
  - name: Research
    description: Public research topic, project and federated metadata catalogs.
  - name: Researchers
    description: Public profiles explicitly enabled for publication.
  - name: HCU
    description: Exploratory human-centric knowledge graph.
  - name: Exports
    description: Public metadata in JSON-LD or CSV format.
  - name: Provenance
    description: Stateless schema validation for provenance envelopes.
  - name: Evidence
    description: Public evidence metadata and stateless receipt verification.
  - name: Ecosystem
    description: Public ecosystem repository discovery and metadata.
  - name: Standard
    description: >-
      TAMV Open Integrity Standard (ETIA/TOIS) v1: structural evaluation of
      classification, funding, publication and certification claims. Not a
      certification scheme, accreditation body or legal opinion.
paths:
  /api/v1/research/topics:
    get:
      operationId: listPublicResearchTopics
      tags: [Research]
      summary: List public research topics
      description: >-
        Editorial topics and contribution modes. A topic is not a publication guarantee
        or a commitment to fund a proposal. The catalog is bounded at 250 records and
        returns 503 instead of silently truncating a larger collection.
      responses:
        "200":
          description: Public topic catalog.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TopicCatalog"
        "503":
          $ref: "#/components/responses/CatalogUnavailable"
  /api/v1/research/projects:
    get:
      operationId: listPublicResearchProjects
      tags: [Research]
      summary: List public project records
      description: >-
        Public records include maturity, declared limitations and provenance metadata.
        A record's presence does not imply production deployment, peer review, certification
        or measured impact. The catalog is bounded at 250 records and returns 503 instead
        of silently truncating a larger collection.
      responses:
        "200":
          description: Public project catalog.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectCatalog"
        "503":
          $ref: "#/components/responses/CatalogUnavailable"
  /api/v1/researchers:
    get:
      operationId: listOptInResearchers
      tags: [Researchers]
      summary: List researcher profiles enabled for public display
      description: Returns only public profile fields selected by the application query. Private email addresses are not included.
      responses:
        "200":
          description: Public researcher directory.
          content:
            application/json:
              schema:
                type: object
                required: [version, records]
                properties:
                  version:
                    type: string
                    example: "1.0"
                  records:
                    type: array
                    items:
                      $ref: "#/components/schemas/ResearcherProfile"
        "503":
          $ref: "#/components/responses/CatalogUnavailable"
  /api/v1/hcu/graph:
    get:
      operationId: getPublicHcuGraph
      tags: [HCU]
      summary: Retrieve the public HCU graph snapshot
      description: >-
        Returns visible domains, atoms and active, structurally valid public
        relationships. The graph represents declared exploratory parameters;
        it is not a causally validated model, a prediction, or a measurement
        of social impact. Operational limits are 50 domains, 250 atoms and 1,000
        edges; exceeding any limit returns 503 rather than a truncated graph or
        a digest that omits records.
      responses:
        "200":
          description: Public HCU graph.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HcuGraph"
        "503":
          $ref: "#/components/responses/CatalogUnavailable"
  /api/v1/exports/research:
    get:
      operationId: exportPublicResearchCatalog
      tags: [Exports]
      summary: Export public research metadata
      description: >-
        Without a format query parameter, returns a Schema.org-oriented
        DataCatalog with public project, topic and consented publication
        metadata. Use format=csv for tabular output. A missing license remains
        unspecified and does not grant reuse rights. Each collection is bounded
        at 250 records; a larger collection returns 503 in either format instead
        of a partial export.
      parameters:
        - name: format
          in: query
          required: false
          description: Choose CSV output. Omit to receive the JSON-LD catalog.
          schema:
            type: string
            enum: [csv]
      responses:
        "200":
          description: JSON-LD catalog or CSV export, selected by format.
          content:
            application/ld+json:
              schema:
                $ref: "#/components/schemas/DataCatalog"
            application/json:
              schema:
                $ref: "#/components/schemas/DataCatalog"
            text/csv:
              schema:
                type: string
                description: CSV metadata export; each record's license/provenance must be reviewed before redistribution.
        "503":
          $ref: "#/components/responses/CatalogUnavailable"
  /api/v1/research/federated:
    post:
      operationId: federatedInstitutionalResearchSearch
      tags: [Research]
      summary: Search public research metadata through institutional or direct anonymous providers
      description: >-
        For research queries, uses the server-configured institutional API when present and otherwise
        searches fixed anonymous Zenodo, Figshare, DataCite, OSF and CERN Open Data endpoints. OSF is a
        title-filtered metadata bridge, not full-text search. Organization queries require the configured
        institutional mechanism. The caller cannot choose an upstream URL. Public requests omit credentials,
        reject redirects, use a 4-second timeout per provider and bound each response to 256 KiB, returning at
        most 4 records per provider and 24 overall. Individual public-provider failures are reported as
        unavailable states without discarding successful providers. This does not share sessions, write data,
        or establish authorship, peer review, quality, endorsement, partnership, licensing or independent verification.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FederatedResearchRequest"
      responses:
        "200":
          description: Validated institutional metadata or direct anonymous public-provider metadata with honest per-provider states.
          headers:
            Cache-Control:
              schema: { type: string, const: no-store }
            X-Content-Type-Options:
              schema: { type: string, const: nosniff }
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FederatedResearchResponse"
        "400":
          description: Malformed JSON, invalid UTF-8 or unreadable request body.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FederatedResearchError"
        "403":
          description: Browser request Origin differs from the API origin. Requests without Origin (such as server-to-server clients) are not origin-checked.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FederatedResearchError"
        "413":
          description: Request body exceeds 2048 bytes.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FederatedResearchError"
        "415":
          description: Content-Type must be application/json.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FederatedResearchError"
        "422":
          description: Query does not satisfy the request schema.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FederatedResearchError"
        "502":
          description: A configured institutional upstream is unavailable or returned invalid metadata.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FederatedResearchError"
        "503":
          description: The configured institutional endpoint is invalid or rate limited, or an organization query has no configured institutional bridge.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FederatedResearchError"
        "504":
          description: The configured institutional endpoint timed out.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FederatedResearchError"
  /api/v1/ecosystem:
    get:
      operationId: getPublicEcosystemCatalog
      summary: Retrieve the public ecosystem catalog
      description: Returns catalog metadata only; it does not probe remote systems.
      tags: [Ecosystem]
      responses:
        "200":
          description: Ecosystem catalog returned successfully.
          headers:
            Cache-Control:
              schema:
                type: string
            X-Content-Type-Options:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EcosystemCatalog"
        "500":
          description: Unexpected server error.
  /api/v1/ecosystem/metadata:
    get:
      operationId: getPublicEcosystemRepositoryMetadata
      tags: [Ecosystem]
      summary: Retrieve bounded public GitHub repository metadata for the ecosystem catalog
      description: >-
        Reads metadata only from the fixed GitHub REST API origin for repository URLs already present in the static registry.
        Per-repository failures are returned in the response. This does not assert deployed application health,
        authentication, authorization, data synchronization, source correctness, or trust.
      responses:
        "200":
          description: Per-repository public metadata results; individual upstream failures do not fail the overall response.
          headers:
            Cache-Control:
              schema: { type: string }
            X-Content-Type-Options:
              schema: { type: string }
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EcosystemRepositoryMetadataResponse"
        "500":
          description: Unexpected failure while constructing the response.
  /api/v1/huggingface:
    get:
      operationId: getPublicHuggingFaceMetadataSnapshot
      tags: [Evidence]
      summary: Retrieve the committed Hugging Face public-metadata snapshot
      description: >-
        Reads a local bounded snapshot generated by the hf CLI from public Hub list commands.
        It performs no runtime network request, uses no credentials, contains no model weights or
        inference output, and does not verify, endorse or recommend any listed repository.
      responses:
        "200":
          description: Public metadata snapshot with explicit limits.
          headers:
            Cache-Control:
              schema: { type: string }
            X-Content-Type-Options:
              schema: { type: string }
          content:
            application/json:
              schema:
                type: object
                required: [ok, schema, generated_at, source, limits, results, semantics]
                properties:
                  ok: { type: boolean, const: true }
                  schema: { type: string, const: "tamv-hf-public-metadata/v1" }
                  generated_at: { type: string, format: date-time }
                  source: { type: string }
                  limits: { type: object }
                  results:
                    type: object
                    required: [models, datasets]
                    properties:
                      models: { type: array, items: { type: object } }
                      datasets: { type: array, items: { type: object } }
                  semantics: { type: string }
        "503":
          description: The committed snapshot is unavailable or invalid.
  /api/v1/provenance/validate:
    post:
      operationId: validateProvenanceRecord
      tags: [Provenance]
      summary: Validate a provenance envelope
      description: >-
        Stateless schema validation only. Does not fetch source URLs, persist
        records, verify authorship, or establish signature, trusted timestamp,
        peer review or accreditation. Request bodies are limited to 65536 bytes.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProvenanceRecord"
      responses:
        "200":
          description: Record satisfies the schema; this is not source verification.
          content:
            application/json:
              schema:
                type: object
                required: [valid, schemaVersion, submittedValidationState, semantics]
                properties:
                  valid: { type: boolean, const: true }
                  schemaVersion: { type: string, const: "1.0.0" }
                  submittedValidationState: { type: string, enum: [unreviewed, schema_valid, source_verified, rejected], description: Claimed input state; not independently verified by this endpoint. }
                  semantics: { type: string }
        "400":
          description: Malformed JSON or invalid UTF-8.
        "413":
          description: Payload exceeds 65536 bytes.
        "415":
          description: Content-Type must be application/json.
        "422":
          description: JSON is valid but fails the provenance schema.
          content:
            application/json:
              schema:
                type: object
                required: [valid, error, issues]
                properties:
                  valid: { type: boolean, const: false }
                  error: { type: string, const: schema_validation_failed }
                  issues:
                    type: array
                    items:
                      type: object
                      required: [path, code, message]
                      properties:
                        path: { type: string }
                        code: { type: string }
                        message: { type: string }
  /api/v1/evidence/receipts/verify:
    post:
      operationId: verifyEvidenceReceipt
      tags: [Evidence]
      summary: Verify shape and integrity of a TAMV evidence receipt
      description: >-
        Stateless verification of a portable evidence receipt
        (tamv.evidence_receipt.v1). The endpoint recomputes the canonical
        SHA-256 digest and compares it with the declared hash. It does not
        receive evidence files, fetch declared URLs, persist the receipt,
        verify authorship, establish trusted time, or grant payment. Request
        bodies are limited to 65536 bytes.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
              description: A complete stamped receipt, including its hash object.
      responses:
        "200":
          description: Shape and integrity hold; higher verification levels were not checked.
          content:
            application/json:
              schema:
                type: object
                required: [valid, levels, digest, semantics, note]
                properties:
                  valid: { type: boolean, const: true }
                  levels:
                    type: object
                    required: [shape, integrity]
                    properties:
                      shape: { type: boolean, const: true }
                      integrity: { type: boolean, const: true }
                  digest: { type: string, pattern: "^[a-f0-9]{64}$" }
                  semantics: { type: string }
                  note: { type: string }
        "400":
          description: Malformed JSON, invalid UTF-8, or unreadable request body.
        "413":
          description: Payload exceeds 65536 bytes.
        "415":
          description: Content-Type must be application/json.
        "422":
          description: The receipt fails the strict schema or its hash does not match.
          content:
            application/json:
              schema:
                type: object
                required: [valid, error, levels, semantics]
                properties:
                  valid: { type: boolean, const: false }
                  error: { type: string, enum: [schema_validation_failed, integrity_mismatch] }
                  levels:
                    type: object
                    properties:
                      shape: { type: boolean }
                      integrity: { type: boolean }
                  expected: { type: string }
                  actual: { type: string }
                  issues:
                    type: array
                    items:
                      type: object
                      required: [path, code, message]
                      properties:
                        path: { type: string }
                        code: { type: string }
                        message: { type: string }
                  semantics: { type: string }
  /api/v1/standard:
    get:
      operationId: getOpenIntegrityStandard
      tags: [Standard]
      summary: Catalog of the TAMV Open Integrity Standard
      description: >-
        Publishes pillars, evidence levels, limitations and endpoint locations.
        It does not evaluate a declaration, certify an organization or imply
        that any identifier or repository is trustworthy.
      responses:
        "200":
          description: Standard catalog.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StandardCatalog"
  /api/v1/standard/references:
    get:
      operationId: getOpenIntegrityReferences
      tags: [Standard]
      summary: External reference catalog with explicit non-goals
      description: >-
        Lists external identifiers, infrastructures, standards and legal
        frameworks, recording what each one does and does not do. Inclusion is
        not endorsement, membership, accreditation or evidence of compliance.
        ISO records are usually paywalled; the linked page is the catalog
        record, not the full text.
      responses:
        "200":
          description: Reference catalog.
          content:
            application/json:
              schema:
                type: object
                required: [schemaVersion, standard, groups, references]
                properties:
                  schemaVersion: { type: string }
                  standard: { type: string }
                  generatedAt: { type: string, format: date-time }
                  semantics: { type: string }
                  groups:
                    type: array
                    items:
                      type: object
                      additionalProperties: true
                  references:
                    type: array
                    items:
                      $ref: "#/components/schemas/StandardReference"
  /api/v1/standard/schema:
    get:
      operationId: getOpenIntegrityDeclarationSchema
      tags: [Standard]
      summary: JSON Schema projection of the declaration schema
      description: >-
        Derived from the authoritative Zod schema. Custom refinements (safe
        URLs, identifier checksums, date consistency) are enforced by the
        evaluate endpoint and are not fully representable in JSON Schema.
      responses:
        "200":
          description: JSON Schema document.
          content:
            application/schema+json:
              schema:
                type: object
        "503":
          description: The projection could not be generated in this runtime.
  /api/v1/standard/evaluate:
    post:
      operationId: evaluateOpenIntegrityDeclaration
      tags: [Standard]
      summary: Structurally evaluate an integrity declaration
      description: >-
        Stateless structural evaluation. The endpoint never fetches declared
        URLs, resolves identifiers, queries registries, contacts certifiers or
        stores the declaration. `verification` is always "unverified". A
        "complete" outcome means structural completeness, not truth. Expiry
        checks use server time, which is returned as `report.referenceDate` and
        covered by the report digest.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StandardDeclaration"
      responses:
        "200":
          description: Structural report with digest.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StandardEvaluationResponse"
        "400":
          description: Malformed JSON or invalid UTF-8.
        "413":
          description: Payload exceeds 65536 bytes.
        "415":
          description: Content-Type must be application/json.
        "422":
          description: The declaration fails the schema; no report is produced.
          content:
            application/json:
              schema:
                type: object
                required: [valid, error, issues]
                properties:
                  valid: { type: boolean, const: false }
                  error: { type: string, const: schema_validation_failed }
                  issues:
                    type: array
                    items:
                      type: object
                      required: [path, code, message]
                      properties:
                        path: { type: string }
                        code: { type: string }
                        message: { type: string }
                  semantics: { type: string }
                  semanticsEs: { type: string }
        "429":
          description: Shared rate limit exceeded; retry after the indicated seconds.
        "503":
          description: The shared rate limiter is unavailable; the endpoint fails closed.
components:
  responses:
    CatalogUnavailable:
      description: A database-backed public catalog could not be read or exceeded its operational record limit.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
  schemas:
    FederatedResearchRequest:
      type: object
      additionalProperties: false
      required: [query]
      properties:
        query: { type: string, minLength: 3, maxLength: 180 }
        type: { type: string, enum: [research, organizations], default: research }
    FederatedResearchResponse:
      type: object
      additionalProperties: false
      required: [ok, provider, query, type, retrievedAt, results, providers, methodology, semantics]
      properties:
        ok: { type: boolean, const: true }
        provider:
          type: string
          enum: ["TAMV Online Network — Institutional Research Platform", "TAMV Online Network — Public Research Providers"]
        query: { type: string, minLength: 3, maxLength: 180 }
        type: { type: string, enum: [research, organizations] }
        retrievedAt: { type: string, format: date-time }
        results:
          type: array
          maxItems: 24
          description: Direct anonymous fallback returns at most 4 unique records per provider and 24 overall; rank is not a quality score.
          items: { $ref: "#/components/schemas/FederatedResearchMetadataRecord" }
        providers:
          type: array
          maxItems: 12
          items: { $ref: "#/components/schemas/FederatedResearchProviderState" }
        methodology: { type: string, minLength: 1, maxLength: 3000 }
        semantics: { type: string }
    FederatedResearchMetadataRecord:
      type: object
      additionalProperties: false
      required: [id, provider, title, url, doi, year, authors, venue, resourceType, citedByCount, license, openAccess, evidenceClass, retrievedAt]
      properties:
        id: { type: string, minLength: 1, maxLength: 1200 }
        provider: { type: string, minLength: 1, maxLength: 120 }
        title: { type: string, minLength: 1, maxLength: 600 }
        url: { type: string, maxLength: 2048, description: "HTTPS URL or empty string when the source has no safe external URL." }
        doi: { type: [string, "null"], maxLength: 500, description: Source-declared DOI only; absence remains null. }
        year: { type: [integer, "null"] }
        authors:
          type: array
          maxItems: 12
          items: { type: string, maxLength: 120 }
        venue: { type: [string, "null"], maxLength: 240 }
        resourceType: { type: [string, "null"], maxLength: 100 }
        citedByCount: { type: [number, "null"] }
        license: { type: [string, "null"], maxLength: 240, description: Source-declared license identifier or label only; null does not grant or deny permission, and a value is not a TAMV reuse grant. }
        openAccess: { type: [boolean, "null"], description: Source-declared only; direct anonymous adapters do not infer access rights. }
        evidenceClass: { type: string, minLength: 1, maxLength: 1200 }
        retrievedAt: { type: string, format: date-time }
    FederatedResearchProviderState:
      type: object
      additionalProperties: false
      required: [id, name, status, count]
      properties:
        id: { type: string, minLength: 1, maxLength: 120 }
        name: { type: string, minLength: 1, maxLength: 180 }
        status: { type: string, enum: [ok, empty, unavailable, not_configured, link_only] }
        count: { type: integer, minimum: 0, maximum: 100000, description: Number of unique normalized records emitted for this provider; unavailable is always 0. }
        note: { type: string, maxLength: 1200 }
    FederatedResearchError:
      type: object
      required: [ok, error]
      properties:
        ok: { type: boolean, const: false }
        error:
          type: string
          enum: [origin_not_allowed, unsupported_media_type, payload_too_large, invalid_utf8, request_body_unreadable, invalid_json, invalid_query, provider_not_configured, provider_configuration_invalid, provider_timeout, provider_rate_limited, provider_unavailable, provider_response_too_large, provider_invalid_response]
        expected: { type: string }
        maxBytes: { type: integer }
        issues:
          type: array
          items:
            type: object
            required: [path, code, message]
            properties:
              path: { type: string }
              code: { type: string }
              message: { type: string }
      additionalProperties: false
    EcosystemRepositoryMetadataResponse:
      type: object
      additionalProperties: false
      required: [schemaVersion, checkedAt, scope, systems]
      properties:
        schemaVersion: { type: string, const: "1.0.0" }
        checkedAt: { type: string, format: date-time, description: "Snapshot assembly time; source data is configured for revalidation every 900 seconds, but stale cached metadata may remain available if an upstream refresh fails." }
        scope: { type: string }
        systems:
          type: array
          items:
            $ref: "#/components/schemas/EcosystemRepositoryMetadataEntry"
    EcosystemRepositoryMetadataEntry:
      type: object
      additionalProperties: false
      required: [systemId, name, repository, sourceMetadataStatus, checkedAt, metadata]
      properties:
        systemId: { type: string, pattern: "^[a-z0-9-]+$" }
        name: { type: string, minLength: 1 }
        repository: { type: string, format: uri }
        sourceMetadataStatus:
          type: string
          enum: [metadata_available, not_found, rate_limited, timeout, upstream_error, invalid_response]
        checkedAt: { type: string, format: date-time, description: "Snapshot assembly time; source data is configured for revalidation every 900 seconds, but stale cached metadata may remain available if an upstream refresh fails." }
        metadata:
          type: [object, "null"]
          additionalProperties: false
          required: [repositoryId, fullName, url, defaultBranch, archived, updatedAt, pushedAt, primaryLanguage, licenseSpdxId]
          properties:
            repositoryId: { type: integer, minimum: 1 }
            fullName: { type: string }
            url: { type: string, format: uri }
            defaultBranch: { type: string, minLength: 1 }
            archived: { type: boolean }
            updatedAt: { type: string, format: date-time }
            pushedAt: { type: [string, "null"], format: date-time }
            primaryLanguage: { type: [string, "null"] }
            licenseSpdxId: { type: [string, "null"] }
    ProvenanceRecord:
      type: object
      additionalProperties: false
      required: [schemaVersion, sourceUri, sourceSystem, observedAt, validationState]
      properties:
        schemaVersion: { type: string, const: "1.0.0" }
        sourceUri: { type: string, format: uri, minLength: 1, description: "Runtime accepts HTTP or HTTPS only." }
        sourceSystem: { type: string, minLength: 1, maxLength: 200 }
        sourceRecordId: { type: [string, "null"], maxLength: 500 }
        sourceVersion: { type: [string, "null"], maxLength: 300 }
        observedAt: { type: string, format: date-time, description: "Must include an explicit timezone and valid calendar date." }
        license: { type: [string, "null"], maxLength: 200 }
        contentDigest:
          oneOf:
            - type: "null"
            - type: object
              additionalProperties: false
              required: [algorithm, value]
              properties:
                algorithm: { type: string, enum: [sha-256, sha-384, sha-512] }
                value: { type: string, pattern: "^[a-fA-F0-9]+$" }
              description: "Hex digest length must match the selected algorithm."
        validationState:
          type: string
          enum: [unreviewed, schema_valid, source_verified, rejected]
        validationEvidenceUri: { type: [string, "null"], format: uri, description: "Runtime accepts HTTP or HTTPS only." }
        notes: { type: [string, "null"], maxLength: 2000 }
    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: string
      additionalProperties: true
    BilingualText:
      type: object
      required: [es, en]
      properties:
        es: { type: string }
        en: { type: string }
      additionalProperties: false
    TopicCatalog:
      type: object
      required: [version, records, note]
      properties:
        version:
          type: string
        records:
          type: array
          maxItems: 250
          items:
            type: object
            required: [id, slug, area, title, question, contributors, formats, modes, status]
            properties:
              id: { type: string }
              slug: { type: string }
              area: { type: string }
              title: { $ref: "#/components/schemas/BilingualText" }
              question: { $ref: "#/components/schemas/BilingualText" }
              contributors: { $ref: "#/components/schemas/BilingualText" }
              formats: { $ref: "#/components/schemas/BilingualText" }
              modes:
                type: array
                items: { type: string }
              status: { type: string }
              updatedAt:
                type: [string, "null"]
                format: date-time
        note:
          type: string
    ProjectCatalog:
      type: object
      required: [version, records, note]
      properties:
        version: { type: string }
        records:
          type: array
          maxItems: 250
          items:
            type: object
            required: [id, slug, category, title, subtitle, description, maturity, limits, provenance]
            properties:
              id: { type: string }
              slug: { type: string }
              category: { type: string }
              title: { $ref: "#/components/schemas/BilingualText" }
              subtitle: { $ref: "#/components/schemas/BilingualText" }
              description: { $ref: "#/components/schemas/BilingualText" }
              maturity: { type: string }
              limits: { $ref: "#/components/schemas/BilingualText" }
              provenance:
                type: object
                required: [verificationStatus]
                properties:
                  sourceUrl:
                    type: [string, "null"]
                    format: uri
                  sourceCommit:
                    type: [string, "null"]
                  license:
                    type: [string, "null"]
                  verificationStatus: { type: string }
                  updatedAt:
                    type: [string, "null"]
                    format: date-time
        note: { type: string }
    ResearcherProfile:
      type: object
      required: [id, publicName, researchLines, verificationStatus]
      properties:
        id: { type: string }
        publicName: { type: string }
        roleCode: { type: [string, "null"] }
        tri: { type: [string, "null"] }
        orcid: { type: [string, "null"] }
        isni: { type: [string, "null"] }
        affiliation: { type: [string, "null"] }
        researchLines:
          type: array
          items: { type: string }
        verificationStatus: { type: string }
      additionalProperties: false
    HcuGraph:
      type: object
      required: [version, modelVersion, domains, atoms, edges, limits, caveat]
      properties:
        version: { type: string }
        modelVersion: { type: string }
        domains:
          type: array
          maxItems: 50
          items:
            type: object
            required: [id, nameEs, nameEn, descriptionEs, descriptionEn, sortOrder]
            properties:
              id: { type: string }
              nameEs: { type: string }
              nameEn: { type: string }
              descriptionEs: { type: string }
              descriptionEn: { type: string }
              sortOrder: { type: integer }
        atoms:
          type: array
          maxItems: 250
          items:
            type: object
            required: [id, domainId, nameEs, nameEn, descriptionEs, descriptionEn, influenceX, riskY, evidenceZ, isProvisional, isQuarantined]
            properties:
              id: { type: string }
              domainId: { type: string }
              nameEs: { type: string }
              nameEn: { type: string }
              descriptionEs: { type: string }
              descriptionEn: { type: string }
              influenceX: { type: number }
              riskY: { type: number }
              evidenceZ: { type: number }
              isProvisional: { type: boolean }
              isQuarantined: { type: boolean }
        edges:
          type: array
          maxItems: 1000
          items:
            type: object
            required: [id, sourceAtomIds, targetAtomIds, weight, sign, delayYears, tqafLevel, evidenceStatus, sourceTitle, sourceUrl]
            properties:
              id: { type: string }
              sourceAtomIds:
                type: array
                items: { type: string }
              targetAtomIds:
                type: array
                items: { type: string }
              weight: { type: number }
              sign: { type: integer }
              delayYears: { type: integer }
              tqafLevel: { type: [string, "null"] }
              evidenceStatus: { type: string }
              sourceTitle: { type: [string, "null"] }
              sourceUrl:
                type: [string, "null"]
                format: uri
        limits:
          type: object
          additionalProperties: false
          required: [domains, atoms, edges]
          properties:
            domains: { type: integer, const: 50 }
            atoms: { type: integer, const: 250 }
            edges: { type: integer, const: 1000 }
        caveat: { type: string }
    DataCatalog:
      type: object
      required: ["@context", "@type", name, url, dateModified, recordLimitPerCollection, recordCounts, distribution, dataset, conditionsOfAccess, note]
      properties:
        "@context":
          type: array
          items: {}
        "@type":
          type: string
          const: DataCatalog
        name: { type: string }
        url:
          type: string
          format: uri
        dateModified:
          type: string
          format: date-time
        recordLimitPerCollection:
          type: integer
          const: 250
        recordCounts:
          type: object
          additionalProperties: false
          required: [projects, topics, publications]
          properties:
            projects: { type: integer, minimum: 0, maximum: 250 }
            topics: { type: integer, minimum: 0, maximum: 250 }
            publications: { type: integer, minimum: 0, maximum: 250 }
        distribution:
          type: array
          items:
            type: object
            properties:
              "@type": { type: string }
              encodingFormat: { type: string }
              contentUrl:
                type: string
                format: uri
        dataset:
          type: array
          items:
            type: object
            additionalProperties: true
        conditionsOfAccess: { type: string }
        note: { type: string }
      additionalProperties: true

    EcosystemCatalog:
      type: object
      additionalProperties: false
      required: [schemaVersion, system, generatedAt, statusSemantics, securityBoundary, systems]
      properties:
        schemaVersion:
          type: string
          const: 1.0.0
        system:
          type: string
          const: TAMV Online Network
        generatedAt:
          type: string
          format: date-time
        statusSemantics:
          type: object
          required: [catalogued, contracted, adapter_implemented, contract_tested, verified]
          properties:
            catalogued: { type: string }
            contracted: { type: string }
            adapter_implemented: { type: string }
            contract_tested: { type: string }
            verified: { type: string }
        securityBoundary:
          type: string
        systems:
          type: array
          items:
            $ref: "#/components/schemas/EcosystemSystem"
    EcosystemSystem:
      type: object
      additionalProperties: false
      required:
        - id
        - name
        - repository
        - responsibility
        - integrationState
        - integrationMode
        - canonicalData
        - allowedInitialCapabilities
        - prohibitedAssumptions
      properties:
        id: { type: string, pattern: "^[a-z0-9-]+$" }
        name: { type: string, minLength: 1 }
        repository: { type: string, format: uri }
        responsibility: { type: string, minLength: 1 }
        integrationState:
          type: string
          enum: [catalogued, contracted, adapter_implemented, contract_tested, verified]
        integrationMode:
          type: string
          enum: [public_metadata, static_site, application, pipeline, trust_service, curriculum]
        canonicalData:
          type: array
          items: { type: string }
        allowedInitialCapabilities:
          type: array
          items: { type: string }
        prohibitedAssumptions:
          type: array
          items: { type: string }
    StandardCatalog:
      type: object
      additionalProperties: true
      required: [schemaVersion, standard, semanticsEs, semanticsEn, evidenceLevels, pillars, endpoints]
      properties:
        schemaVersion: { type: string }
        standard:
          type: object
          required: [id, version, status, nameEs, nameEn]
          properties:
            id: { type: string, const: tamv.open_integrity.v1 }
            version: { type: string, const: 1.0.0 }
            status: { type: string, enum: [public-draft] }
            nameEs: { type: string }
            nameEn: { type: string }
            shortEs: { type: string }
            shortEn: { type: string }
            url: { type: string, format: uri }
        semanticsEs: { type: string }
        semanticsEn: { type: string }
        limitationsEs:
          type: array
          items: { type: string }
        limitationsEn:
          type: array
          items: { type: string }
        outcomes:
          type: object
          additionalProperties: { type: string }
        evidenceLevels:
          type: array
          items:
            type: object
            required: [id, labelEs, labelEn, descriptionEs, descriptionEn]
            properties:
              id: { type: string, enum: [declared, documented, attested, verified] }
              labelEs: { type: string }
              labelEn: { type: string }
              descriptionEs: { type: string }
              descriptionEn: { type: string }
        pillars:
          type: array
          items:
            type: object
            required: [id, nameEs, nameEn, purposeEs, purposeEn]
            properties:
              id:
                type: string
                enum: [classification, funding, publication, certification, cross_cutting]
              nameEs: { type: string }
              nameEn: { type: string }
              purposeEs: { type: string }
              purposeEn: { type: string }
        endpoints:
          type: object
          additionalProperties: { type: string }
        references:
          type: object
          additionalProperties: true
    StandardReference:
      type: object
      additionalProperties: false
      required: [id, name, kind, issuer, url, access, pillars, group, whatItDoesEs, whatItDoesEn, whatItDoesNotDoEs, whatItDoesNotDoEn]
      properties:
        id: { type: string }
        name: { type: string }
        kind:
          type: string
          enum: [identifier, definition, standard, metadata, repository, certification, policy, platform, legal, taxonomy]
        issuer: { type: string }
        url: { type: string, format: uri }
        access:
          type: string
          enum: [open, registration, membership, paywalled, mixed]
        pillars:
          type: array
          items:
            type: string
            enum: [classification, funding, publication, certification, cross_cutting]
        group:
          type: string
          enum: [identity, publication, licensing, certification, funding, policy, metadata, legal]
        whatItDoesEs: { type: string }
        whatItDoesEn: { type: string }
        whatItDoesNotDoEs: { type: string }
        whatItDoesNotDoEn: { type: string }
        noteEs: { type: string }
        noteEn: { type: string }
    StandardDeclaration:
      type: object
      additionalProperties: false
      required: [schemaVersion, subject, funding, publication, transparency]
      description: >-
        Shape summary. The authoritative, full projection is served by
        GET /api/v1/standard/schema and enforced by POST /api/v1/standard/evaluate.
      properties:
        schemaVersion: { type: string, const: tamv.open_integrity.declaration.v1 }
        subject:
          type: object
          additionalProperties: true
        funding:
          type: object
          additionalProperties: true
        publication:
          type: object
          additionalProperties: true
        certificationClaims:
          type: array
          items:
            type: object
            additionalProperties: true
        transparency:
          type: object
          additionalProperties: true
        legal:
          type: object
          additionalProperties: true
        security:
          type: object
          additionalProperties: true
        accessibility:
          type: object
          additionalProperties: true
    StandardCheck:
      type: object
      additionalProperties: false
      required: [id, pillar, titleEs, titleEn, status, evidence, detailEs, detailEn]
      properties:
        id: { type: string }
        pillar:
          type: string
          enum: [classification, funding, publication, certification, cross_cutting]
        titleEs: { type: string }
        titleEn: { type: string }
        status: { type: string, enum: [pass, warn, fail, not_applicable] }
        evidence: { type: string, enum: [declared, documented, attested] }
        detailEs: { type: string }
        detailEn: { type: string }
        remediationEs: { type: string }
        remediationEn: { type: string }
    StandardPillarSummary:
      type: object
      additionalProperties: false
      required: [pillar, status, total, passed, warnings, failed, notApplicable]
      properties:
        pillar:
          type: string
          enum: [classification, funding, publication, certification, cross_cutting]
        status: { type: string, enum: [complete, conditional, blocked] }
        total: { type: integer, minimum: 0 }
        passed: { type: integer, minimum: 0 }
        warnings: { type: integer, minimum: 0 }
        failed: { type: integer, minimum: 0 }
        notApplicable: { type: integer, minimum: 0 }
    StandardClaimAssessment:
      type: object
      additionalProperties: false
      required: [id, claimType, declaredStatus, issuerType, evidence, verification, noteEs, noteEn]
      properties:
        id: { type: string }
        claimType:
          type: string
          enum: [self_declaration, third_party_certification, accreditation, registration, indexing, badge, award]
        declaredStatus:
          type: string
          enum: [active, suspended, revoked, expired, unknown]
        issuerType:
          type: string
          enum: [intergovernmental, standards_body, accreditation_body, certification_body, repository, publisher, community, self, unknown]
        expiresAt: { type: [string, "null"], format: date-time }
        expiresInDays: { type: [integer, "null"] }
        expired: { type: [boolean, "null"] }
        evidence: { type: string, enum: [declared, documented, attested] }
        verification: { type: string, const: unverified }
        noteEs: { type: string }
        noteEn: { type: string }
    StandardReport:
      type: object
      additionalProperties: false
      required: [schema, standard, subject, outcome, verification, evidenceCeiling, pillars, checks, claimAssessments, limitationsEs, limitationsEn, remediation, semanticsEs, semanticsEn, digest]
      properties:
        schema: { type: string, const: tamv.open_integrity.report.v1 }
        standard:
          type: object
          additionalProperties: true
        subject:
          type: object
          required: [id, name, type]
          properties:
            id: { type: string }
            name: { type: string }
            type: { type: string, enum: [project, organization, person, output, infrastructure, event] }
        outcome: { type: string, enum: [complete, conditional, blocked] }
        outcomeMeaningEs: { type: string }
        outcomeMeaningEn: { type: string }
        verification: { type: string, const: unverified }
        evidenceCeiling: { type: string, enum: [declared, documented, attested] }
        referenceDate: { type: [string, "null"], format: date-time }
        pillars:
          type: array
          items:
            $ref: "#/components/schemas/StandardPillarSummary"
        checks:
          type: array
          items:
            $ref: "#/components/schemas/StandardCheck"
        claimAssessments:
          type: array
          items:
            $ref: "#/components/schemas/StandardClaimAssessment"
        limitationsEs:
          type: array
          items: { type: string }
        limitationsEn:
          type: array
          items: { type: string }
        remediation:
          type: array
          items:
            type: object
            required: [checkId, pillar, severity, actionEs, actionEn]
            properties:
              checkId: { type: string }
              pillar:
                type: string
                enum: [classification, funding, publication, certification, cross_cutting]
              severity: { type: string, enum: [warning, blocker] }
              actionEs: { type: string }
              actionEn: { type: string }
        semanticsEs: { type: string }
        semanticsEn: { type: string }
        canonicalization: { type: string, const: tamv-jcs-1 }
        digestScope: { type: string }
        digest: { type: string, pattern: "^sha256:[a-f0-9]{64}$" }
    StandardEvaluationResponse:
      type: object
      additionalProperties: false
      required: [valid, report, note]
      properties:
        valid: { type: boolean, const: true }
        report:
          $ref: "#/components/schemas/StandardReport"
        note: { type: string }
